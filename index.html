<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACUARIO VALPARAÍSO POS</title>
    <!-- Librerías de carga instantánea (Sin dependencias externas que fallen en GitHub) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; 
            margin: 0;
            user-select: none;
            /* Fondo Marino */
            background: linear-gradient(180deg, #001233 0%, #001d3d 50%, #000814 100%);
            height: 100vh;
        }

        /* Efecto de burbujas decorativas */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #ffffff10 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
        
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glassmorphism: Efecto de cristal para las áreas de trabajo */
        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .product-card { 
            height: 110px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .product-card:active { transform: scale(0.96); }
        
        .marine-gradient {
            background: linear-gradient(135deg, #003566 0%, #001d3d 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const html = htm.bind(React.createElement);
        const { useState, useEffect, useMemo } = React;

        // --- ICONOS SVG ---
        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                Waves: React.createElement('path', { d: "M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" }),
                ShoppingCart: React.createElement('path', { d: "m3 3 3 .5m0 0L8 13h10l2-7H6.5M16 19a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM9 19a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z" }),
                Compass: React.createElement('g', null, React.createElement('circle', { cx: "12", cy: "12", r: "10" }), React.createElement('path', { d: "m16.2 7.8-2 7.4-7.4 2 2-7.4 7.4-2Z" })),
                History: React.createElement('g', null, React.createElement('path', { d: "M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 0V3m0 5h5" }), React.createElement('path', { d: "M12 7v5l4 2" })),
                BarChart3: React.createElement('path', { d: "M3 20h18M7 16V8M11 16V4M15 16V10M19 16v-4" }),
                Trash2: React.createElement('path', { d: "M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" }),
                Search: React.createElement('g', null, React.createElement('circle', { cx: "11", cy: "11", r: "8" }), React.createElement('path', { d: "m21 21-4.3-4.3" })),
                Ticket: React.createElement('path', { d: "M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" }),
                Gift: React.createElement('path', { d: "M20 12v10H4V12M2 7h20v5H2V7Zm10 15V7m0 0a3 3 0 1 0-3-3m3 3a3 3 0 1 1 3-3" }),
                Utensils: React.createElement('g', null, React.createElement('path', { d: "M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" }), React.createElement('path', { d: "M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" })),
                X: React.createElement('path', { d: "M18 6 6 18M6 6l12 12" }),
                Plus: React.createElement('path', { d: "M12 5v14M5 12h14" }),
                Minus: React.createElement('path', { d: "M5 12h14" }),
                Users: React.createElement('path', { d: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2m8-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm14 10v-2a4 4 0 0 0-3-3.87" }),
                Save: React.createElement('path', { d: "M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8" }),
                Anchor: React.createElement('path', { d: "M12 5V2m0 20c5.5 0 10-4.5 10-10h-2a8 8 0 0 1-16 0H2c0 5.5 4.5 10 10 10Zm0-15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" })
            };
            return React.createElement('svg', {
                width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
                strokeWidth: "2.5", strokeLinecap: "round", strokeLinejoin: "round", className: className
            }, icons[name] || null);
        };

        const INITIAL_PRODUCTS = [
            { id: 1, name: "General", price: 4900, category: "Entradas", color: "bg-sky-50" },
            { id: 2, name: "Niños y 3ra Edad", price: 3900, category: "Entradas", color: "bg-sky-50" },
            { id: 3, name: "General BCI", price: 3675, category: "Entradas", color: "bg-cyan-50" },
            { id: 4, name: "Niños y 3E BCI", price: 2925, category: "Entradas", color: "bg-cyan-50" },
            { id: 5, name: "General EPV", price: 2450, category: "Entradas", color: "bg-blue-50" },
            { id: 6, name: "Niños y 3E EPV", price: 1950, category: "Entradas", color: "bg-blue-50" },
            { id: 7, name: "Estudiante TNE", price: 2500, category: "Entradas", color: "bg-indigo-50" },
            { id: 8, name: "Discapacidad", price: 2500, category: "Entradas", color: "bg-indigo-50" },
            { id: 9, name: "Cumpleaños", price: 2500, category: "Entradas", color: "bg-indigo-50" },
            { id: 10, name: "Reserva Alumnos", price: 2500, category: "Reservas", color: "bg-orange-50" },
            { id: 11, name: "Reserva Adultos", price: 3500, category: "Reservas", color: "bg-orange-50" },
            { id: 12, name: "Reserva Docente", price: 0, category: "Reservas", color: "bg-green-50" },
            { id: 20, name: "Tiburon XL", price: 10000, category: "Zoovenir", color: "bg-purple-50" },
            { id: 21, name: "Tiburon Martillo", price: 10000, category: "Zoovenir", color: "bg-purple-50" },
            { id: 22, name: "Tortuga", price: 6000, category: "Zoovenir", color: "bg-purple-50" },
            { id: 23, name: "Foca", price: 10000, category: "Zoovenir", color: "bg-purple-50" },
            { id: 24, name: "Ll. Tortuga", price: 3000, category: "Zoovenir", color: "bg-purple-50" },
            { id: 25, name: "Ll. Pinguino", price: 3000, category: "Zoovenir", color: "bg-purple-50" },
            { id: 26, name: "Ll. Tiburon", price: 6000, category: "Zoovenir", color: "bg-purple-50" },
            { id: 27, name: "Pulpo Reversible", price: 6000, category: "Zoovenir", color: "bg-purple-50" },
            { id: 30, name: "Ll. Ballena", price: 3500, category: "Zoovenir", color: "bg-purple-50" },
            { id: 40, name: "Coyac", price: 300, category: "Comida", color: "bg-teal-50" },
            { id: 41, name: "Chicle", price: 200, category: "Comida", color: "bg-teal-50" },
            { id: 42, name: "Flippy", price: 500, category: "Comida", color: "bg-teal-50" },
            { id: 43, name: "Loop", price: 500, category: "Comida", color: "bg-teal-50" },
            { id: 44, name: "Pañuelos", price: 300, category: "Comida", color: "bg-teal-50" },
            { id: 45, name: "Agua Mineral", price: 1200, category: "Comida", color: "bg-teal-50" },
            { id: 46, name: "Bebida", price: 1700, category: "Comida", color: "bg-teal-50" }
        ];

        const GUIDES = ["Coni", "Teru", "Maqui", "Maca", "Ignacio", "Javier"];

        const App = () => {
            const [currentView, setCurrentView] = useState('pos');
            const [activeCategory, setActiveCategory] = useState('Todas');
            const [cart, setCart] = useState([]);
            const [sales, setSales] = useState(() => JSON.parse(localStorage.getItem('av_sales') || '[]'));
            const [tours, setTours] = useState(() => JSON.parse(localStorage.getItem('av_tours') || '[]'));
            const [searchTerm, setSearchTerm] = useState('');
            const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
            const [paymentMethod, setPaymentMethod] = useState('efectivo');
            const [cashReceived, setCashReceived] = useState('');
            const [currentTime, setCurrentTime] = useState(new Date());
            const [selectedGuide, setSelectedGuide] = useState('');
            const [peopleCount, setPeopleCount] = useState(1);
            const [activeReportTab, setActiveReportTab] = useState('todas');

            useEffect(() => { localStorage.setItem('av_sales', JSON.stringify(sales)); }, [sales]);
            useEffect(() => { localStorage.setItem('av_tours', JSON.stringify(tours)); }, [tours]);
            useEffect(() => { const t = setInterval(() => setCurrentTime(new Date()), 1000); return () => clearInterval(t); }, []);

            const filteredProducts = INITIAL_PRODUCTS.filter(p => 
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) && 
                (activeCategory === 'Todas' || p.category === activeCategory)
            );

            const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

            const reports = useMemo(() => {
                const process = (method) => {
                    const res = {}; let te = 0; let tt = 0;
                    INITIAL_PRODUCTS.forEach(p => res[p.id] = { ...p, sold: 0, rev: 0 });
                    sales.forEach(s => {
                        if (!method || s.method === method) {
                            s.items.forEach(i => {
                                if (res[i.id]) {
                                    res[i.id].sold += i.quantity; res[i.id].rev += (i.price * i.quantity);
                                    if (i.category === 'Entradas' || i.category === 'Reservas') te += (i.price * i.quantity); else tt += (i.price * i.quantity);
                                }
                            });
                        }
                    });
                    const allItems = Object.values(res);
                    return {
                        entradas: allItems.filter(i => (i.category === 'Entradas' || i.category === 'Reservas') && i.sold > 0),
                        tienda: allItems.filter(i => (i.category === 'Zoovenir' || i.category === 'Comida') && i.sold > 0),
                        totalEntradas: te, totalTienda: tt
                    };
                };
                return { todas: process(null), efectivo: process('efectivo'), debito: process('debito') };
            }, [sales]);

            const addToCart = (p) => {
                setCart(prev => {
                    const ex = prev.find(x => x.id === p.id);
                    if (ex) return prev.map(x => x.id === p.id ? { ...x, quantity: x.quantity + 1 } : x);
                    return [...prev, { ...p, quantity: 1 }];
                });
            };

            const updateQty = (id, d) => setCart(prev => prev.map(x => x.id === id ? { ...x, quantity: Math.max(0, x.quantity + d) } : x).filter(x => x.quantity > 0));

            const finalizeSale = () => {
                const n = {
                    id: Date.now().toString().slice(-4),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    items: [...cart], total, method: paymentMethod
                };
                setSales([n, ...sales]); setCart([]); setIsCheckoutOpen(false); setCashReceived('');
            };

            const handleCreateTour = (sendWhatsApp = false) => {
                if (!selectedGuide) return;
                const now = new Date();
                // Tiempo base: Ahora + 15 min (redondeado)
                let tourDate = new Date(Math.round(now.getTime() / 300000) * 300000 + 900000);

                if (tours.length > 0) {
                    // 15 min separación global
                    const lastGlobal = tours[0];
                    const [gh, gm] = lastGlobal.startTime.split(':').map(Number);
                    const lastGlobalD = new Date(); lastGlobalD.setHours(gh, gm, 0, 0);
                    if ((tourDate - lastGlobalD) / 60000 < 15) tourDate = new Date(lastGlobalD.getTime() + 900000);

                    // 45 min mismo guía (30 min tour + 15 min descanso)
                    const lastGuideTour = tours.find(t => t.guide === selectedGuide);
                    if (lastGuideTour) {
                        const [lh, lm] = lastGuideTour.startTime.split(':').map(Number);
                        const lastGuideD = new Date(); lastGuideD.setHours(lh, lm, 0, 0);
                        if ((tourDate - lastGuideD) / 60000 < 45) tourDate = new Date(lastGuideD.getTime() + 2700000);
                    }
                }

                const endD = new Date(tourDate.getTime() + 1800000);
                const s = tourDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const e = endD.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                setTours([{ id: Date.now(), guide: selectedGuide, startTime: s, endTime: e, people: peopleCount }, ...tours]);
                setPeopleCount(1);
                
                if (sendWhatsApp) {
                    window.open(`https://wa.me/?text=${encodeURIComponent(`🌊 *RECORRIDO AGENDADO*\n⏰ Hora: ${s} - ${e}\n👤 Guía: ${selectedGuide}\n👥 Personas: ${peopleCount}`)}`, '_blank');
                }
            };

            const updateTourPeople = (id, delta) => setTours(prev => prev.map(t => t.id === id ? { ...t, people: Math.max(1, t.people + delta) } : t));

            const resetDay = () => { if (confirm("¿Reiniciar jornada? Se borrarán ventas y turnos.")) { setSales([]); setTours([]); localStorage.clear(); } };
            const fmt = (v) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', minimumFractionDigits: 0 }).format(v);

            return html`
                <div className="flex h-screen overflow-hidden text-slate-900 text-sm relative z-10">
                    <!-- Sidebar Marino -->
                    <aside className="w-16 lg:w-48 marine-gradient text-white flex flex-col shrink-0 z-20 shadow-2xl border-r border-white/5">
                        <div className="p-4 lg:p-5 mb-2 flex items-center gap-3">
                            <div className="bg-sky-400 p-1.5 rounded-lg shadow-lg text-white"><${Icon} name="Waves" size=${18} /></div>
                            <h1 className="hidden lg:block font-black text-xs uppercase tracking-tight">Acuario <span class="text-sky-400">Valpo</span></h1>
                        </div>
                        <nav className="flex-1 px-2 mt-4 space-y-1">
                            ${[
                                { id: 'pos', icon: 'ShoppingCart', label: 'Vender' },
                                { id: 'tours', icon: 'Compass', label: 'Tours' },
                                { id: 'history', icon: 'History', label: 'Bitácora' },
                                { id: 'reports', icon: 'BarChart3', label: 'Cierre' }
                            ].map(item => html`
                                <button onClick=${() => setCurrentView(item.id)} className=${`w-full flex items-center justify-center lg:justify-start gap-3 p-3 rounded-xl transition-all ${currentView === item.id ? 'bg-sky-500 text-white shadow-xl translate-x-1' : 'text-slate-400 hover:bg-white/5'}`}>
                                    <${Icon} name=${item.icon} size=${16} /><span className="hidden lg:block font-bold text-[10px] uppercase tracking-wider">${item.label}</span>
                                </button>
                            `)}
                        </nav>
                        <button onClick=${resetDay} className="p-4 mt-auto border-t border-white/5 text-red-400 hover:bg-red-500/10 flex items-center justify-center lg:justify-start gap-2 transition-colors">
                            <${Icon} name="Trash2" size=${14} />
                            <span className="hidden lg:block text-[9px] font-black uppercase">Cerrar Día</span>
                        </button>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-10 glass-panel border-b border-slate-200/50 flex items-center justify-between px-6 shrink-0 shadow-sm">
                            <div className="text-[10px] font-bold font-mono text-slate-500 flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                                ${currentTime.toLocaleTimeString()}
                            </div>
                            <div className="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] italic">Terminal Operativo Marino</div>
                        </header>

                        <div className="flex-1 overflow-hidden relative">
                            ${currentView === 'pos' && html`
                                <div className="flex h-full flex-col lg:flex-row animate-fade">
                                    <div className="flex-1 p-4 lg:p-6 overflow-y-auto custom-scrollbar">
                                        <div className="flex flex-col md:flex-row justify-between mb-6 gap-3">
                                            <div className="relative flex-1 group">
                                                <${Icon} name="Search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-sky-500 transition-colors" size=${14} />
                                                <input type="text" placeholder="Buscar producto..." className="w-full pl-10 pr-4 py-2 bg-white/80 border border-slate-200 rounded-xl text-xs outline-none focus:ring-4 focus:ring-sky-500/10 transition-all" value=${searchTerm} onChange=${e => setSearchTerm(e.target.value)} />
                                            </div>
                                            <div className="flex gap-1.5 bg-slate-200/50 p-1 rounded-xl glass-panel">
                                                ${['Todas', 'Entradas', 'Reservas', 'Zoovenir', 'Comida'].map(cat => html`
                                                    <button key=${cat} onClick=${() => setActiveCategory(cat)} className=${`px-4 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all ${activeCategory === cat ? 'bg-sky-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-700'}`}>${cat}</button>
                                                `)}
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
                                            ${filteredProducts.map(p => html`
                                                <button key=${p.id} onClick=${() => addToCart(p)} className="product-card glass-panel p-3 rounded-2xl border border-slate-200 hover:border-sky-400 flex flex-col justify-between text-left group shadow-sm hover:shadow-lg transition-all">
                                                    <div className="flex justify-between items-start">
                                                        <div className=${`${p.color} w-8 h-8 rounded-lg flex items-center justify-center text-sky-700 shadow-sm`}>
                                                            <${Icon} name="Plus" size=${12} />
                                                        </div>
                                                        <span class="text-[7px] font-black text-slate-300 uppercase tracking-tighter opacity-0 group-hover:opacity-100 transition-opacity">${p.category}</span>
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-slate-800 text-[10px] leading-tight mb-1 uppercase tracking-tight line-clamp-2">${p.name}</h3>
                                                        <p className="text-sky-600 font-black text-xs">${fmt(p.price)}</p>
                                                    </div>
                                                </button>
                                            `)}
                                        </div>
                                    </div>
                                    
                                    <div className="w-full lg:w-[280px] glass-panel border-l border-slate-200 flex flex-col shrink-0 shadow-2xl">
                                        <div className="p-4 border-b flex justify-between items-center">
                                            <h2 className="font-black text-[11px] uppercase text-slate-400 flex items-center gap-2 tracking-tighter"><${Icon} name="ShoppingCart" size=${14} /> Orden Actual</h2>
                                            <button onClick=${() => setCart([])} className="text-[9px] font-bold text-red-400 uppercase">Vaciar</button>
                                        </div>
                                        <div className="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar">
                                            ${cart.map(item => html`
                                                <div key=${item.id} className="bg-white/50 p-2.5 rounded-xl border border-slate-100 flex items-center gap-3 animate-fade shadow-sm">
                                                    <div className="flex-1 min-w-0 leading-tight">
                                                        <p className="text-[10px] font-black text-slate-800 truncate">${item.name}</p>
                                                        <p className="text-[9px] text-sky-500 font-bold">${fmt(item.price)}</p>
                                                    </div>
                                                    <div className="flex items-center bg-white rounded-lg border shadow-inner">
                                                        <button onClick=${() => updateQty(item.id, -1)} className="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-red-500"><${Icon} name="Minus" size=${8}/></button>
                                                        <span className="w-5 text-center text-[10px] font-black">${item.quantity}</span>
                                                        <button onClick=${() => updateQty(item.id, 1)} className="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-emerald-500"><${Icon} name="Plus" size=${8}/></button>
                                                    </div>
                                                </div>
                                            `)}
                                        </div>
                                        <div className="p-5 marine-gradient text-white shadow-2xl">
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="text-[10px] font-bold text-sky-300 uppercase tracking-widest">Total a Cobrar</span>
                                                <span className="text-2xl font-black text-white tracking-tighter">${fmt(total)}</span>
                                            </div>
                                            <button onClick=${() => setIsCheckoutOpen(true)} disabled=${cart.length === 0} className="w-full bg-sky-400 hover:bg-sky-300 py-3 rounded-xl font-black text-[11px] uppercase tracking-widest disabled:opacity-20 active:scale-95 transition-all shadow-xl">COBRAR VENTA</button>
                                        </div>
                                    </div>
                                </div>
                            `}

                            ${currentView === 'tours' && html`
                                <div className="p-6 animate-fade h-full max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="glass-panel p-8 rounded-3xl border border-white/50 shadow-xl h-fit space-y-8">
                                        <div>
                                            <h2 className="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">1. Seleccionar Guía</h2>
                                            <div className="grid grid-cols-2 gap-2">
                                                ${GUIDES.map(g => html`
                                                    <button key=${g} onClick=${() => setSelectedGuide(g)} className=${`p-3 rounded-xl text-center font-bold text-[11px] border-2 transition-all ${selectedGuide === g ? 'bg-sky-50 border-sky-500 text-sky-700 shadow-md' : 'bg-slate-50 border-transparent text-slate-400 hover:bg-slate-100'}`}>${g}</button>
                                                `)}
                                            </div>
                                        </div>

                                        <div>
                                            <h2 className="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">2. Grupo de Personas</h2>
                                            <div className="flex items-center gap-6 bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-inner">
                                                <button onClick=${() => setPeopleCount(Math.max(1, peopleCount - 1))} className="w-12 h-12 bg-white rounded-xl border shadow-sm flex items-center justify-center text-slate-400 hover:text-slate-900 active:scale-90 transition-all"><${Icon} name="Minus" size=${16} /></button>
                                                <div className="flex-1 text-center">
                                                    <span className="text-3xl font-black text-slate-800">${peopleCount}</span>
                                                    <p className="text-[9px] font-bold text-slate-400 uppercase">Integrantes</p>
                                                </div>
                                                <button onClick=${() => setPeopleCount(peopleCount + 1)} className="w-12 h-12 bg-white rounded-xl border shadow-sm flex items-center justify-center text-slate-400 hover:text-slate-900 active:scale-90 transition-all"><${Icon} name="Plus" size=${16} /></button>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 gap-2.5 pt-4 border-t border-slate-100">
                                            <button onClick=${() => handleCreateTour(false)} disabled=${!selectedGuide} className="w-full bg-slate-800 text-white py-3.5 rounded-xl font-black flex items-center justify-center gap-2 uppercase text-[10px] tracking-widest shadow-lg hover:bg-slate-700 active:scale-95 transition-all"><${Icon} name="Save" size=${14} /> Guardar Local</button>
                                            <button onClick=${() => handleCreateTour(true)} disabled=${!selectedGuide} className="w-full bg-emerald-600 text-white py-3.5 rounded-xl font-black flex items-center justify-center gap-2 uppercase text-[10px] tracking-widest shadow-lg hover:bg-emerald-500 active:scale-95 transition-all"><${Icon} name="Waves" size=${14} /> WhatsApp</button>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <h3 className="font-black uppercase text-[10px] text-slate-100 tracking-[0.3em] ml-2 drop-shadow-md">Turnos Registrados</h3>
                                        <div className="space-y-3 overflow-y-auto max-h-[600px] pr-2 custom-scrollbar">
                                            ${tours.map(t => html`
                                                <div key=${t.id} className="glass-panel p-4 rounded-2xl border border-white/40 flex flex-col gap-4 shadow-xl animate-fade group">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-4">
                                                            <div className="bg-sky-500 text-white px-3 py-2 rounded-xl font-black text-xs border border-white/20 shadow-md">
                                                                ${t.startTime} - ${t.endTime}
                                                            </div>
                                                            <p className="font-black text-slate-800 text-xs uppercase tracking-tight">${t.guide}</p>
                                                        </div>
                                                        <button onClick=${() => setTours(tours.filter(x => x.id !== t.id))} className="text-red-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><${Icon} name="Trash2" size=${14} /></button>
                                                    </div>
                                                    <div className="flex items-center justify-between bg-white/40 p-2.5 rounded-xl border border-white/20">
                                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">👥 Personas</span>
                                                        <div className="flex items-center gap-3">
                                                            <button onClick=${() => updateTourPeople(t.id, -1)} className="w-7 h-7 bg-white/80 rounded-lg border shadow-sm flex items-center justify-center text-slate-400 hover:text-slate-900 active:scale-90 transition-all"><${Icon} name="Minus" size=${12} /></button>
                                                            <span className="font-black text-slate-800 min-w-[20px] text-center">${t.people}</span>
                                                            <button onClick=${() => updateTourPeople(t.id, 1)} className="w-7 h-7 bg-white/80 rounded-lg border shadow-sm flex items-center justify-center text-slate-400 hover:text-slate-900 active:scale-90 transition-all"><${Icon} name="Plus" size=${12} /></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            `)}
                                            ${tours.length === 0 && html`<div className="p-20 text-center text-slate-300 font-bold uppercase text-[10px] border-2 border-dashed border-white/20 rounded-3xl">Cola de recorridos vacía</div>`}
                                        </div>
                                    </div>
                                </div>
                            `}

                            ${currentView === 'history' && html`
                                <div className="p-6 animate-fade h-full max-w-2xl mx-auto space-y-3">
                                    <h2 className="text-xs font-black text-slate-100 uppercase tracking-[0.3em] mb-6 drop-shadow-md">Registro de Ventas Hoy</h2>
                                    ${sales.map(s => html`
                                        <div key=${s.id} className="glass-panel p-4 rounded-2xl border border-white/50 flex items-center justify-between shadow-lg">
                                            <div className="flex-1 min-w-0 pr-6 leading-relaxed">
                                                <div className="flex items-center gap-3 mb-2">
                                                    <p className="text-[11px] font-black text-slate-800 tracking-tight">${s.time} <span class="text-slate-300 ml-1 font-mono">#${s.id}</span></p>
                                                    <span className=${`text-[8px] font-black px-2 py-0.5 rounded-full uppercase tracking-tighter ${s.method === 'efectivo' ? 'bg-emerald-500 text-white' : 'bg-sky-500 text-white'}`}>${s.method}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-500 italic truncate uppercase">${s.items.map(i => `${i.quantity}x ${i.name}`).join(', ')}</p>
                                            </div>
                                            <p className="text-sm font-black text-sky-800 tabular-nums">${fmt(s.total)}</p>
                                        </div>
                                    `)}
                                    ${sales.length === 0 && html`<div class="p-20 text-center text-slate-300 font-bold uppercase text-[10px]">Sin ventas registradas</div>`}
                                </div>
                            `}

                            ${currentView === 'reports' && html`
                                <div className="p-6 animate-fade max-w-4xl mx-auto space-y-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xs font-black text-slate-100 uppercase tracking-[0.3em] drop-shadow-md">Cierre de Caja</h2>
                                        <div className="flex bg-white/20 p-1 rounded-xl glass-panel">
                                            ${['todas', 'efectivo', 'debito'].map(tab => html`
                                                <button onClick=${() => setActiveReportTab(tab)} className=${`px-4 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all ${activeReportTab === tab ? 'bg-white text-slate-800 shadow-xl' : 'text-slate-300 hover:text-white'}`}>${tab}</button>
                                            `)}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className=${`p-6 rounded-3xl text-white shadow-2xl flex flex-col justify-between h-32 ${activeReportTab === 'todas' ? 'bg-sky-800' : activeReportTab === 'efectivo' ? 'bg-emerald-600' : 'bg-blue-600'}`}>
                                            <p className="text-[10px] font-black uppercase tracking-widest opacity-70">Total Entradas + Reservas</p>
                                            <h3 className="text-3xl font-black tracking-tighter">${fmt(reports[activeReportTab].totalEntradas)}</h3>
                                        </div>
                                        <div className=${`p-6 rounded-3xl text-white shadow-2xl flex flex-col justify-between h-32 ${activeReportTab === 'todas' ? 'bg-indigo-800' : activeReportTab === 'efectivo' ? 'bg-emerald-700' : 'bg-blue-700'}`}>
                                            <p className="text-[10px] font-black uppercase tracking-widest opacity-70">Total Tienda (Souvenir + Comida)</p>
                                            <h3 className="text-3xl font-black tracking-tighter">${fmt(reports[activeReportTab].totalTienda)}</h3>
                                        </div>
                                    </div>

                                    <div className="glass-panel rounded-3xl border border-white/50 overflow-hidden shadow-2xl">
                                        <table className="w-full text-left text-[10px]">
                                            <thead className="bg-slate-50/50 border-b border-slate-200 font-black text-slate-400 uppercase tracking-widest">
                                                <tr><th className="p-4 text-center">Unds</th><th className="p-4">Descripción de Ítem</th><th className="p-4 text-right">Recaudación</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                <tr><td colspan="3" class="p-2.5 bg-sky-50/50 text-[9px] font-black text-sky-600 uppercase tracking-widest">Categoría: Entradas</td></tr>
                                                ${reports[activeReportTab].entradas.map(p => html`
                                                    <tr class="hover:bg-white/40"><td class="p-3 text-center font-bold text-sky-600 w-16">${p.sold}</td><td class="p-3 uppercase font-semibold text-slate-700">${p.name}</td><td class="p-3 text-right font-black text-slate-800">${fmt(p.rev)}</td></tr>
                                                `)}
                                                <tr><td colspan="3" class="p-2.5 bg-indigo-50/50 text-[9px] font-black text-indigo-600 uppercase tracking-widest">Categoría: Tienda</td></tr>
                                                ${reports[activeReportTab].tienda.map(p => html`
                                                    <tr class="hover:bg-white/40"><td class="p-3 text-center font-bold text-indigo-600 w-16">${p.sold}</td><td class="p-3 uppercase font-semibold text-slate-700">${p.name}</td><td class="p-3 text-right font-black text-slate-800">${fmt(p.rev)}</td></tr>
                                                `)}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `}
                        </div>
                    </main>
                    
                    <!-- Checkout -->
                    ${isCheckoutOpen && html`
                        <div className="fixed inset-0 bg-[#000814]/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-[320px] rounded-[3rem] shadow-2xl overflow-hidden animate-fade">
                                <div className="p-8 text-center marine-gradient text-white relative">
                                    <button onClick=${() => setIsCheckoutOpen(false)} className="absolute top-6 right-6 text-sky-300 hover:text-white transition-colors"><${Icon} name="X" size=${18} /></button>
                                    <p className="text-sky-400 text-[10px] font-black uppercase mb-2 tracking-[0.2em]">Importe Final</p>
                                    <h3 className="text-5xl font-black tracking-tighter">${fmt(total)}</h3>
                                </div>
                                <div className="p-8 space-y-6 text-center">
                                    <div className="flex gap-2 p-1.5 bg-slate-100 rounded-2xl">
                                        <button onClick=${() => setPaymentMethod('efectivo')} className=${`flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all ${paymentMethod === 'efectivo' ? 'bg-white text-slate-800 shadow-lg' : 'text-slate-400'}`}>Efectivo</button>
                                        <button onClick=${() => setPaymentMethod('debito')} className=${`flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all ${paymentMethod === 'debito' ? 'bg-white text-slate-800 shadow-lg' : 'text-slate-400'}`}>Débito</button>
                                    </div>
                                    ${paymentMethod === 'efectivo' && html`
                                        <div className="space-y-4 animate-fade">
                                            <input type="number" className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl text-4xl font-black text-center outline-none focus:border-sky-500 transition-all" placeholder="0" value=${cashReceived} onChange=${e => setCashReceived(e.target.value)} autoFocus />
                                            <div className="p-4 rounded-2xl bg-emerald-50 text-center border border-emerald-100">
                                                <p className="text-emerald-700 font-bold text-[8px] uppercase tracking-widest mb-1">Vuelto Sugerido</p>
                                                <p className="text-2xl font-black text-emerald-600 tracking-tighter">${fmt(Math.max(0, (parseFloat(cashReceived) || 0) - total))}</p>
                                            </div>
                                        </div>
                                    `}
                                    <button onClick=${finalizeSale} disabled=${paymentMethod === 'efectivo' && (!cashReceived || parseFloat(cashReceived) < total)} className="w-full marine-gradient text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-2xl active:scale-95 disabled:opacity-20 transition-all">FINALIZAR TRANSACCIÓN</button>
                                </div>
                            </div>
                        </div>
                    `}
                </div>
            `;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
