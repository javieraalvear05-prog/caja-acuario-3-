<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACUARIO VALPARAÍSO POS</title>
    <!-- Librerías de producción ultra-rápidas -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- HTM reemplaza a Babel: pesa 100 veces menos y es instantáneo -->
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; 
            background-color: #f8fafc; 
            margin: 0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }
        .animate-fade { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .product-card {
            height: 140px; /* Tamaño reducido para evitar que se vean gigantes */
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const html = htm.bind(React.createElement);
        const { useState, useEffect, useMemo } = React;

        // Iconos SVG integrados optimizados
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Waves: React.createElement('path', { d: "M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" }),
                ShoppingCart: React.createElement('path', { d: "m3 3 3 .5m0 0L8 13h10l2-7H6.5M16 19a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM9 19a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z" }),
                Compass: React.createElement('g', null, 
                    React.createElement('circle', { cx: "12", cy: "12", r: "10" }),
                    React.createElement('path', { d: "m16.2 7.8-2 7.4-7.4 2 2-7.4 7.4-2Z" })
                ),
                History: React.createElement('g', null, 
                    React.createElement('path', { d: "M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 0V3m0 5h5" }),
                    React.createElement('path', { d: "M12 7v5l4 2" })
                ),
                BarChart3: React.createElement('path', { d: "M3 20h18M7 16V8M11 16V4M15 16V10M19 16v-4" }),
                Trash2: React.createElement('g', null, 
                    React.createElement('path', { d: "M3 6h18" }),
                    React.createElement('path', { d: "M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" }),
                    React.createElement('path', { d: "M10 11v6" }),
                    React.createElement('path', { d: "M14 11v6" })
                ),
                Plus: React.createElement('path', { d: "M12 5v14M5 12h14" }),
                Minus: React.createElement('path', { d: "M5 12h14" }),
                Search: React.createElement('g', null, 
                    React.createElement('circle', { cx: "11", cy: "11", r: "8" }),
                    React.createElement('path', { d: "m21 21-4.3-4.3" })
                ),
                Ticket: React.createElement('path', { d: "M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" }),
                Gift: React.createElement('g', null, 
                    React.createElement('rect', { x: "3", y: "8", width: "18", height: "4", rx: "1" }),
                    React.createElement('path', { d: "M12 8V3" })
                ),
                Utensils: React.createElement('g', null, 
                    React.createElement('path', { d: "M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" }),
                    React.createElement('path', { d: "M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" })
                ),
                Anchor: React.createElement('g', null, 
                    React.createElement('path', { d: "M12 5V2" }),
                    React.createElement('path', { d: "M12 22c5.5 0 10-4.5 10-10h-2a8 8 0 0 1-16 0H2c0 5.5 4.5 10 10 10Zm0-15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" })
                ),
                MessageCircle: React.createElement('path', { d: "M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7c1.1 0 2.1.2 3.1.6l4.4-1.1-1.1 4.4a8.38 8.38 0 0 1 .1 4Z" }),
                X: React.createElement('path', { d: "M18 6 6 18M6 6l12 12" }),
                Clock: React.createElement('g', null, 
                    React.createElement('circle', { cx: "12", cy: "12", r: "10" }),
                    React.createElement('path', { d: "M12 6v6l4 2" })
                ),
                CreditCard: React.createElement('g', null, 
                    React.createElement('rect', { x: "2", y: "5", width: "20", height: "14", rx: "2" }),
                    React.createElement('path', { d: "M2 10h20" })
                ),
                Banknote: React.createElement('g', null, 
                    React.createElement('rect', { x: "2", y: "6", width: "20", height: "12", rx: "2" }),
                    React.createElement('circle', { cx: "12", cy: "12", r: "2" })
                )
            };
            return React.createElement('svg', {
                xmlns: "http://www.w3.org/2000/svg",
                width: size,
                height: size,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: "2.5",
                strokeLinecap: "round",
                strokeLinejoin: "round",
                className: className
            }, icons[name] || null);
        };

        const INITIAL_PRODUCTS = [
            { id: 1, name: "Entrada General Adulto", price: 4900, category: "Entradas", color: "bg-sky-50", icon: "Ticket" },
            { id: 2, name: "Entrada Niño", price: 3900, category: "Entradas", color: "bg-sky-50", icon: "Ticket" },
            { id: 4, name: "Entrada BCI", price: 3675, category: "Entradas", color: "bg-cyan-50", icon: "Ticket" },
            { id: 5, name: "Peluche Tiburón Blanco", price: 12000, category: "Zoovenir", color: "bg-blue-50", icon: "Gift" },
            { id: 6, name: "Gorra Acuario Valpo", price: 6500, category: "Zoovenir", color: "bg-blue-50", icon: "Gift" },
            { id: 11, name: "Combo Fish & Chips", price: 7500, category: "Comida", color: "bg-teal-50", icon: "Utensils" },
            { id: 13, name: "Bebida Océano 500ml", price: 2000, category: "Comida", color: "bg-teal-50", icon: "Utensils" },
        ];

        const GUIDES = ["Guía Marina", "Guía Sebastián", "Guía Javiera", "Guía Rodrigo"];

        const App = () => {
            const [currentView, setCurrentView] = useState('pos');
            const [activeCategory, setActiveCategory] = useState('Todas');
            const [cart, setCart] = useState([]);
            const [salesHistory, setSalesHistory] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
            const [paymentMethod, setPaymentMethod] = useState('efectivo');
            const [cashReceived, setCashReceived] = useState('');
            const [currentTime, setCurrentTime] = useState(new Date());
            const [selectedGuide, setSelectedGuide] = useState('');
            const [tourHistory, setTourHistory] = useState([]);
            const [activeReportTab, setActiveReportTab] = useState('todas');

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const filteredProducts = INITIAL_PRODUCTS.filter(p => 
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) && 
                (activeCategory === 'Todas' || p.category === activeCategory)
            );

            const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

            const reportsByMethod = useMemo(() => {
                const generateReport = (methodFilter) => {
                    const report = {};
                    let totalRevenue = 0;
                    INITIAL_PRODUCTS.forEach(p => report[p.id] = { ...p, soldCount: 0, revenue: 0 });
                    
                    salesHistory.forEach(sale => {
                        if (!methodFilter || sale.method === methodFilter) {
                            sale.items.forEach(item => {
                                if (report[item.id]) {
                                    report[item.id].soldCount += item.quantity;
                                    report[item.id].revenue += (item.price * item.quantity);
                                    totalRevenue += (item.price * item.quantity);
                                }
                            });
                        }
                    });
                    return { items: Object.values(report).sort((a, b) => b.soldCount - a.soldCount), totalRevenue };
                };
                return { todas: generateReport(null), efectivo: generateReport('efectivo'), debito: generateReport('debito') };
            }, [salesHistory]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    return [...prev, { ...product, quantity: 1 }];
                });
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => 
                    item.id === id ? { ...item, quantity: Math.max(0, item.quantity + delta) } : item
                ).filter(i => i.quantity > 0));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const finalizeSale = () => {
                const newSale = {
                    id: `AV-${Date.now().toString().slice(-6)}`,
                    time: new Date().toLocaleTimeString(),
                    items: [...cart],
                    total,
                    method: paymentMethod
                };
                setSalesHistory([newSale, ...salesHistory]);
                setCart([]); setIsCheckoutOpen(false); setCashReceived('');
            };

            const handleCreateTour = () => {
                if (!selectedGuide) return;
                const now = new Date();
                const ms = 1000 * 60 * 5; 
                const roundedDate = new Date(Math.round(now.getTime() / ms) * ms);
                let tourDate = new Date(roundedDate.getTime() + 15 * 60000);

                if (tourHistory.length > 0) {
                    const lastTour = tourHistory[0];
                    const [lastHours, lastMinutes] = lastTour.startTime.split(':').map(Number);
                    const lastDate = new Date();
                    lastDate.setHours(lastHours, lastMinutes, 0, 0);

                    const diffInMinutes = (tourDate - lastDate) / 60000;
                    if (diffInMinutes < 15) {
                        tourDate = new Date(lastDate.getTime() + 15 * 60000);
                    }
                }

                const endDate = new Date(tourDate.getTime() + 30 * 60000);
                const startTimeStr = tourDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const endTimeStr = endDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                setTourHistory([{ id: Date.now(), guide: selectedGuide, startTime: startTimeStr, endTime: endTimeStr }, ...tourHistory]);
                window.open(`https://wa.me/?text=${encodeURIComponent(`🌊 *ACUARIO VALPARAÍSO*: Recorrido programado de ${startTimeStr} a ${endTimeStr} con el guía ${selectedGuide}`)}`, '_blank');
            };

            const formatMoney = (v) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', minimumFractionDigits: 0 }).format(v);

            return html`
                <div className="flex h-screen overflow-hidden bg-slate-50 text-slate-900 font-sans">
                    <!-- Barra Lateral Rediseñada -->
                    <aside className="w-16 lg:w-56 bg-[#001d3d] text-white flex flex-col shrink-0 border-r border-blue-900 shadow-xl z-20">
                        <div className="p-4 lg:p-5 mb-4 flex items-center gap-3">
                            <div className="bg-sky-500 p-1.5 rounded-lg text-white shadow-md"><${Icon} name="Waves" size=${20} /></div>
                            <div className="hidden lg:block">
                                <h1 className="font-black text-xs uppercase leading-none tracking-tight">Acuario <span className="text-sky-400">Valpo</span></h1>
                            </div>
                        </div>
                        <nav className="flex-1 px-2 lg:px-3 space-y-1.5">
                            <button onClick=${() => setCurrentView('pos')} className=${`w-full flex items-center justify-center lg:justify-start gap-3 p-3 rounded-xl transition-all ${currentView === 'pos' ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <${Icon} name="ShoppingCart" size=${18} /><span className="hidden lg:block font-bold text-xs">Vender</span>
                            </button>
                            <button onClick=${() => setCurrentView('tours')} className=${`w-full flex items-center justify-center lg:justify-start gap-3 p-3 rounded-xl transition-all ${currentView === 'tours' ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <${Icon} name="Compass" size=${18} /><span className="hidden lg:block font-bold text-xs">Recorridos</span>
                            </button>
                            <button onClick=${() => setCurrentView('history')} className=${`w-full flex items-center justify-center lg:justify-start gap-3 p-3 rounded-xl transition-all ${currentView === 'history' ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <${Icon} name="History" size=${18} /><span className="hidden lg:block font-bold text-xs">Bitácora</span>
                            </button>
                            <button onClick=${() => setCurrentView('reports')} className=${`w-full flex items-center justify-center lg:justify-start gap-3 p-3 rounded-xl transition-all ${currentView === 'reports' ? 'bg-sky-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <${Icon} name="BarChart3" size=${18} /><span className="hidden lg:block font-bold text-xs">Reportes</span>
                            </button>
                        </nav>
                        <div className="p-4 mt-auto border-t border-blue-900/50 flex items-center justify-center lg:justify-start gap-2">
                            <${Icon} name="Anchor" size=${16} className="text-sky-400" />
                            <span className="text-[9px] font-bold uppercase hidden lg:block text-sky-200">Valparaíso</span>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-slate-50">
                        <header className="h-14 bg-white border-b flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
                            <div className="bg-sky-50 px-3 py-1 rounded-full text-sky-600 border border-sky-100 text-[10px] font-bold font-mono">${currentTime.toLocaleTimeString()}</div>
                            <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest italic hidden sm:block">POS Terminal • v2.1</div>
                        </header>

                        <div className="flex-1 overflow-hidden">
                            ${currentView === 'pos' && html`
                                <div className="flex h-full flex-col lg:flex-row animate-fade">
                                    <div className="flex-1 p-4 lg:p-6 overflow-y-auto bg-slate-50/50 custom-scrollbar">
                                        <div className="flex flex-col md:flex-row justify-between mb-6 gap-3">
                                            <div className="relative flex-1">
                                                <${Icon} name="Search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size=${16} />
                                                <input type="text" placeholder="Buscar..." className="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-4 focus:ring-sky-500/10 outline-none shadow-sm transition-all" value=${searchTerm} onChange=${e => setSearchTerm(e.target.value)} />
                                            </div>
                                            <div className="flex gap-1.5 bg-white p-1 rounded-xl border shadow-sm">
                                                ${['Todas', 'Entradas', 'Zoovenir', 'Comida'].map(cat => html`
                                                    <button key=${cat} onClick=${() => setActiveCategory(cat)} className=${`px-4 py-1.5 rounded-lg text-[9px] font-black uppercase transition-all whitespace-nowrap ${activeCategory === cat ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-50'}`}>${cat}</button>
                                                `)}
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 pb-20">
                                            ${filteredProducts.map(p => html`
                                                <button key=${p.id} onClick=${() => addToCart(p)} className=${`${p.color} product-card p-4 rounded-3xl border-2 border-transparent hover:border-sky-300 transition-all flex flex-col justify-between text-left shadow-sm active:scale-95 group`}>
                                                    <div className="flex justify-between items-start">
                                                        <div className="bg-white/80 p-1.5 rounded-lg text-sky-700 shadow-sm"><${Icon} name=${p.icon} size=${18} /></div>
                                                        <div className="bg-sky-600 text-white p-1 rounded-md opacity-0 group-hover:opacity-100 transition-all"><${Icon} name="Plus" size=${14} /></div>
                                                    </div>
                                                    <div>
                                                        <p className="text-[7px] font-black uppercase text-sky-400 leading-none">${p.category}</p>
                                                        <h3 className="font-bold text-slate-800 text-[11px] my-0.5 leading-tight line-clamp-2">${p.name}</h3>
                                                        <p className="text-sky-700 font-black text-sm group-hover:text-sky-900">${formatMoney(p.price)}</p>
                                                    </div>
                                                </button>
                                            `)}
                                        </div>
                                    </div>
                                    
                                    <!-- Carrito Más Estilizado -->
                                    <div className="w-full lg:w-[360px] bg-white border-l flex flex-col shadow-2xl shrink-0">
                                        <div className="p-4 border-b flex justify-between items-center bg-sky-50/20">
                                            <h2 className="font-black text-sm flex items-center gap-2 text-sky-900 uppercase tracking-tight"><${Icon} name="ShoppingCart" size=${16} /> Orden</h2>
                                            <button onClick=${() => setCart([])} className="text-[9px] font-bold text-red-400 uppercase tracking-widest hover:text-red-600 transition-colors">Limpiar</button>
                                        </div>
                                        <div className="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50/30 custom-scrollbar">
                                            ${cart.map(item => html`
                                                <div key=${item.id} className="bg-white p-3 rounded-2xl border border-slate-100 flex items-center gap-2 shadow-sm hover:border-sky-100 transition-all animate-fade">
                                                    <div className="flex-1 leading-tight">
                                                        <p className="text-[11px] font-bold text-slate-800 leading-none mb-1">${item.name}</p>
                                                        <p className="text-[9px] text-sky-400 uppercase font-bold">${formatMoney(item.price)}</p>
                                                    </div>
                                                    <div className="flex items-center bg-slate-50 rounded-lg p-1 border">
                                                        <button onClick=${() => updateQuantity(item.id, -1)} className="w-6 h-6 flex items-center justify-center hover:bg-white rounded-md text-slate-400 hover:text-sky-600"><${Icon} name="Minus" size=${12}/></button>
                                                        <span className="w-6 text-center text-[10px] font-black text-slate-700">${item.quantity}</span>
                                                        <button onClick=${() => updateQuantity(item.id, 1)} className="w-6 h-6 flex items-center justify-center hover:bg-white rounded-md text-slate-400 hover:text-sky-600"><${Icon} name="Plus" size=${12}/></button>
                                                    </div>
                                                    <button onClick=${() => removeFromCart(item.id)} className="text-red-200 hover:text-red-500 transition-colors p-1"><${Icon} name="Trash2" size={14}/></button>
                                                </div>
                                            `)}
                                            ${cart.length === 0 && html`
                                                <div className="h-full flex flex-col items-center justify-center text-slate-200 py-10 opacity-50">
                                                    <${Icon} name="ShoppingCart" size=${32} className="mb-2" />
                                                    <p className="font-bold text-[9px] uppercase">Sin productos</p>
                                                </div>
                                            `}
                                        </div>
                                        <div className="p-6 bg-slate-900 text-white rounded-t-[2.5rem] shadow-2xl">
                                            <div className="flex justify-between items-center mb-4 px-1">
                                                <span className="text-[10px] font-bold text-slate-400 uppercase">Total Final</span>
                                                <span className="text-3xl font-black tracking-tight text-sky-400">${formatMoney(total)}</span>
                                            </div>
                                            <button onClick=${() => setIsCheckoutOpen(true)} disabled=${cart.length === 0} className="w-full bg-sky-500 hover:bg-sky-400 text-white py-3.5 rounded-2xl font-black text-sm uppercase tracking-wider shadow-lg transition-all disabled:opacity-30 active:scale-95">COBRAR VENTA</button>
                                        </div>
                                    </div>
                                </div>
                            `}

                            ${currentView === 'tours' && html`
                                <div className="flex-1 p-6 lg:p-8 overflow-y-auto bg-sky-50/20 custom-scrollbar animate-fade h-full">
                                    <div className="max-w-4xl mx-auto space-y-6">
                                        <h2 className="text-2xl font-black text-slate-900 uppercase tracking-tighter">Recorridos Guiados</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                            <div className="bg-white p-6 rounded-[2rem] border shadow-lg">
                                                <label className="block text-[9px] font-black text-slate-400 uppercase mb-4 text-center tracking-widest leading-none">Asignar Guía</label>
                                                <div className="grid grid-cols-2 gap-2 mb-6">
                                                    ${GUIDES.map(g => html`
                                                        <button key=${g} onClick=${() => setSelectedGuide(g)} className=${`p-3 rounded-xl text-left font-bold text-[10px] border-2 transition-all ${selectedGuide === g ? 'bg-sky-50 border-sky-500 text-sky-700' : 'bg-slate-50 border-transparent text-slate-400 hover:bg-slate-100'}`}>${g}</button>
                                                    `)}
                                                </div>
                                                <button onClick=${handleCreateTour} disabled=${!selectedGuide} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-xl font-black flex items-center justify-center gap-2 active:scale-95 transition-all shadow-md uppercase text-[11px]"><${Icon} name="MessageCircle" size={18} /> WhatsApp</button>
                                            </div>
                                            <div className="space-y-3">
                                                <h3 className="font-black uppercase text-[9px] text-slate-400 ml-2 tracking-widest">Próximos Turnos (30 min)</h3>
                                                <div className="space-y-2 overflow-y-auto max-h-[400px] custom-scrollbar pr-2">
                                                    ${tourHistory.length === 0 ? html`<div className="p-10 text-center text-slate-300 font-bold uppercase text-[10px] border-2 border-dashed rounded-3xl bg-white/50">Vacío</div>` : 
                                                        tourHistory.map(t => html`
                                                            <div key=${t.id} className="bg-white p-4 rounded-2xl border flex items-center justify-between shadow-sm animate-fade">
                                                                <div className="flex items-center gap-3">
                                                                    <div className="bg-sky-50 text-sky-600 p-3 rounded-xl font-black text-sm shadow-inner border border-sky-100">${t.startTime}</div>
                                                                    <div>
                                                                        <p className="font-black text-slate-800 text-[11px] uppercase leading-none mb-1">${t.guide}</p>
                                                                        <span className="text-[8px] font-bold text-slate-400 uppercase">Hasta: ${t.endTime}</span>
                                                                    </div>
                                                                </div>
                                                                <${Icon} name="Clock" size=${16} className="text-emerald-500" />
                                                            </div>
                                                        `)
                                                    }
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `}

                            ${currentView === 'history' && html`
                                <div className="flex-1 p-6 lg:p-8 overflow-y-auto custom-scrollbar animate-fade h-full bg-slate-50">
                                    <div className="max-w-2xl mx-auto space-y-4">
                                        <h2 className="text-2xl font-black text-slate-900 uppercase tracking-tighter">Bitácora</h2>
                                        <div className="space-y-3">
                                            ${salesHistory.length === 0 ? html`<div className="p-10 text-center text-slate-300 font-bold uppercase text-xs">No hay ventas registradas</div>` : 
                                                salesHistory.map(s => html`
                                                    <div key=${s.id} className="bg-white p-4 rounded-2xl border flex items-center justify-between shadow-sm animate-fade">
                                                        <div className="flex items-center gap-4 flex-1">
                                                            <div className="w-10 h-10 bg-slate-100 text-slate-500 rounded-lg flex items-center justify-center font-black text-[9px] border">#ID</div>
                                                            <div className="flex-1">
                                                                <div className="flex items-center gap-2 mb-1">
                                                                    <p className="text-[10px] font-black text-slate-800 leading-none uppercase">${s.id}</p>
                                                                    <span className=${`text-[7px] font-black px-1.5 py-0.5 rounded-full uppercase ${s.method === 'efectivo' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>${s.method}</span>
                                                                </div>
                                                                <p className="text-[8px] text-slate-400 font-bold mb-1">${s.time}</p>
                                                                <p className="text-[9px] text-slate-500 font-medium italic line-clamp-1">${s.items.map(i => `${i.quantity}x ${i.name}`).join(', ')}</p>
                                                            </div>
                                                        </div>
                                                        <p className="text-lg font-black text-sky-800 tabular-nums">${formatMoney(s.total)}</p>
                                                    </div>
                                                `)
                                            }
                                        </div>
                                    </div>
                                </div>
                            `}

                            ${currentView === 'reports' && html`
                                <div className="flex-1 p-6 lg:p-8 overflow-y-auto custom-scrollbar animate-fade">
                                    <div className="max-w-3xl mx-auto space-y-6">
                                        <div className="flex justify-between items-end gap-4">
                                            <h2 className="text-2xl font-black text-slate-900 uppercase tracking-tighter">Inventario</h2>
                                            <div className="flex bg-white p-1 rounded-xl border shadow-sm border-slate-200">
                                                <button onClick=${() => setActiveReportTab('todas')} className=${`px-3 py-1 rounded-lg text-[8px] font-black uppercase transition-all ${activeReportTab === 'todas' ? 'bg-slate-800 text-white' : 'text-slate-400'}`}>Todas</button>
                                                <button onClick=${() => setActiveReportTab('efectivo')} className=${`px-3 py-1 rounded-lg text-[8px] font-black uppercase flex items-center gap-1.5 ${activeReportTab === 'efectivo' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                                                    <${Icon} name="Banknote" size=${12} /> Efectivo
                                                </button>
                                                <button onClick=${() => setActiveReportTab('debito')} className=${`px-3 py-1 rounded-lg text-[8px] font-black uppercase flex items-center gap-1.5 ${activeReportTab === 'debito' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                                                    <${Icon} name="CreditCard" size=${12} /> Débito
                                                </button>
                                            </div>
                                        </div>

                                        <div className=${`p-6 rounded-[2rem] text-white shadow-lg animate-fade flex justify-between items-center ${activeReportTab === 'todas' ? 'bg-slate-800' : activeReportTab === 'efectivo' ? 'bg-emerald-600' : 'bg-blue-600'}`}>
                                            <div>
                                                <p className="text-[9px] font-black uppercase tracking-widest opacity-70 mb-1">Recaudación Final</p>
                                                <h3 className="text-4xl font-black tracking-tight">${formatMoney(reportsByMethod[activeReportTab].totalRevenue)}</h3>
                                            </div>
                                            <div className="bg-white/10 p-3 rounded-2xl"><${Icon} name=${activeReportTab === 'efectivo' ? 'Banknote' : 'BarChart3'} size=${32} /></div>
                                        </div>

                                        <div className="bg-white rounded-[2rem] border overflow-hidden shadow-xl border-blue-50">
                                            <table className="w-full text-left text-[11px]">
                                                <thead className="bg-slate-50 border-b font-black text-[8px] text-slate-400 uppercase tracking-widest">
                                                    <tr>
                                                        <th className="p-5">Producto</th>
                                                        <th className="p-5 text-center">Unidades</th>
                                                        <th className="p-5 text-right">Monto</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-50">
                                                    ${reportsByMethod[activeReportTab].items.map(p => html`
                                                        <tr key=${p.id} className=${`${p.soldCount > 0 ? 'bg-white' : 'opacity-20'}`}>
                                                            <td className="p-5 font-bold text-slate-700">${p.name}</td>
                                                            <td className="p-5 text-center font-black text-sky-600 text-sm">${p.soldCount}</td>
                                                            <td className="p-5 text-right font-bold text-slate-500">${formatMoney(p.revenue)}</td>
                                                        </tr>
                                                    `)}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            `}
                        </div>
                    </main>
                    
                    <!-- Modal de Cobro Más Compacto -->
                    ${isCheckoutOpen && html`
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-[340px] rounded-[3rem] shadow-2xl overflow-hidden animate-fade">
                                <div className="p-8 text-center bg-slate-900 text-white relative">
                                    <button onClick=${() => setIsCheckoutOpen(false)} className="absolute top-6 right-6 text-slate-500 hover:text-white transition-colors leading-none"><${Icon} name="X" size=${20} /></button>
                                    <p className="text-sky-400 text-[9px] font-black uppercase mb-2 tracking-[0.2em]">Total Ticket</p>
                                    <h3 className="text-5xl font-black tracking-tighter">${formatMoney(total)}</h3>
                                </div>
                                <div className="p-8 space-y-6 text-center">
                                    <div className="flex gap-2">
                                        <button onClick=${() => setPaymentMethod('efectivo')} className=${`flex-1 py-3 rounded-xl border-2 text-[10px] font-black uppercase transition-all ${paymentMethod === 'efectivo' ? 'bg-sky-50 border-sky-500 text-sky-700' : 'text-slate-300 border-transparent bg-slate-50'}`}>Efectivo</button>
                                        <button onClick=${() => setPaymentMethod('debito')} className=${`flex-1 py-3 rounded-xl border-2 text-[10px] font-black uppercase transition-all ${paymentMethod === 'debito' ? 'bg-blue-50 border-blue-500 text-blue-700' : 'text-slate-300 border-transparent bg-slate-50'}`}>Débito</button>
                                    </div>
                                    
                                    ${paymentMethod === 'efectivo' && html`
                                        <div className="space-y-3 animate-fade">
                                            <input type="number" className="w-full bg-slate-50 border-none p-4 rounded-2xl text-4xl font-black text-center outline-none focus:ring-4 focus:ring-sky-500/10 shadow-inner" placeholder="0" value=${cashReceived} onChange=${e => setCashReceived(e.target.value)} autoFocus />
                                            <div className="p-4 rounded-2xl bg-emerald-50 text-center border border-emerald-100">
                                                <p className="text-emerald-700 font-bold text-[9px] uppercase mb-1">Vuelto</p>
                                                <p className="text-3xl font-black text-emerald-600 tabular-nums">${formatMoney(Math.max(0, (parseFloat(cashReceived) || 0) - total))}</p>
                                            </div>
                                        </div>
                                    `}
                                    <div className="space-y-3 pt-2">
                                        <button onClick=${finalizeSale} disabled=${paymentMethod === 'efectivo' && (!cashReceived || parseFloat(cashReceived) < total)} className="w-full bg-sky-600 hover:bg-sky-500 text-white py-4 rounded-2xl font-black text-xs shadow-xl uppercase tracking-wider transition-all active:scale-95 disabled:opacity-20">Finalizar</button>
                                        <button onClick=${() => { setIsCheckoutOpen(false); setCashReceived(''); }} className="w-full text-slate-400 font-bold uppercase text-[9px] hover:text-slate-600">Cancelar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `}
                </div>
            `;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
